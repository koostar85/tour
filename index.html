<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 가이드 지도</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    
    <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

    <style>
        /* 지도가 화면 전체를 채우도록 설정 */
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', dotum, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* 🗺️ AI 분석 결과창 스타일링 (우측 상단 고정) */
        #ai-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 320px;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
        }
        #ai-container h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
            color: #222;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #btn-analyze {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #btn-analyze:hover {
            background: #1d4ed8;
        }
        #btn-analyze:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        #ai-result {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #374151;
            padding: 10px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #f3f4f6;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ai-container">
        <h3>✨ Gemini AI 여행지 분석</h3>
        <button id="btn-analyze">AI에게 가이드 요청하기</button>
        <div id="ai-result">버튼을 누르면 제미나이가 지도 데이터(tour.geojson)를 분석하여 맞춤 가이드를 작성합니다.</div>
    </div>

    <script>
        // ==========================================
        // 1. PMTiles 지도 설정 및 로드
        // ==========================================
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        // 대한민국 중심부 근처로 기본 지도 설정
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {},
                layers: [{
                    id: 'background',
                    type: 'background',
                    paint: { 'background-color': '#f8f9fa' }
                }]
            },
            center: [127.5, 36.5], 
            zoom: 7
        });

        map.on('load', async () => {
            // 내가 업로드한 map1.pmtiles 레이어 추가
            map.addSource('pmtiles-source', {
                type: 'vector',
                url: 'pmtiles://' + window.location.origin + '/tour/map1.pmtiles'
            });

            // 내 폴더 안의 tour.geojson 데이터 레이어 추가 및 시각화
            map.addSource('tour-data', {
                type: 'geojson',
                data: './tour.geojson'
            });

            // 지도 위에 여행지 위치를 점(Circle)으로 표시
            map.addLayer({
                id: 'tour-points',
                type: 'circle',
                source: 'tour-data',
                paint: {
                    'circle-radius': 6,
                    'circle-color': '#ea580c',
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#fff'
                }
            });
        });

        // ==========================================
        // 2. 🤖 Gemini 백엔드 서버 연동 이벤트 코드
        // ==========================================
        document.getElementById('btn-analyze').addEventListener('click', async () => {
            const btn = document.getElementById('btn-analyze');
            const resultDiv = document.getElementById('ai-result');
            
            // 로딩 상태 변경
            btn.disabled = true;
            resultDiv.innerHTML = "⏳ <b>로딩 중...</b><br>제미나이 AI가 관광지 데이터를 정밀 분석하고 있습니다.<br>(약 3~5초 소요)";

            try {
                // ⚠️ 현재 정상 작동 중인 Codespaces 가상 서버 API 주소 호출
                const response = await fetch('https://effective-meme-v69xp7jprgjj3q7x-3000.app.github.dev/api/analyze-geo');
                if (!response.ok) {
                    throw new Error(`서버 응답 에러 (상태 코드: ${response.status})`);
                }

                const data = await response.json();

                if (data.success) {
                    // 성공적으로 받아온 분석 리포트 화면에 출력
                    resultDiv.innerText = data.result;
                } else {
                    resultDiv.innerText = "❌ AI 분석 실패: " + data.error;
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = "❌ <b>연결 실패</b><br>백엔드 서버에 접속할 수 없습니다.<br>Codespaces 터미널에서 <b>node server.js</b>가 켜져 있는지 확인하세요!";
            } finally {
                // 버튼 다시 활성화
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
