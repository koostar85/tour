<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>대한민국 공간정보 AI 검색 포털 (백엔드 연동형)</title>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background-color: #f4f3f0; }
        
        .ai-container {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 340px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .ai-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .ai-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ai-btn:hover { background: #1557b0; }
        .ai-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* 백엔드가 리턴해 준 텍스트 분석 보고서창 */
        .status-box { 
            font-size: 13px; 
            color: #374151; 
            max-height: 250px; 
            overflow-y: auto; 
            background: #f9fafb; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #f3f4f6;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .legend {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; padding: 12px; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3); font-size: 12px; line-height: 20px; min-width: 120px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-key { display: inline-block; border-radius: 50%; width: 10px; height: 10px; margin-right: 8px; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ai-container">
    <h3>🪄 Gemini GIS 통합 AI 검색</h3>
    <div class="input-group">
        <input type="text" id="gis-command" class="ai-input" placeholder="여기를 누르면 Gemini 백엔드가 가이드를 시작합니다." readonly value="전체 관광 데이터 가이드 분석 요청">
        <button id="send-btn" class="ai-btn">요청</button>
    </div>
    <div id="status" class="status-box">버튼을 누르면 제미나이가 지도 데이터(tour.geojson)를 정밀 분석합니다.</div>
</div>

<div class="legend" id="map-legend">
    <h4>🎨 데이터 마커 구분</h4>
</div>

<script>
    const typeColors = {
        '관광지': '#007cbf',
        '축제': '#ff5252',
        '행사': '#2ecc71',
        '공연': '#9b59b6',
        '기타': '#7f8c8d'
    };

    // 범례 자동 생성
    const legendEl = document.getElementById('map-legend');
    Object.keys(typeColors).forEach(type => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="legend-key" style="background-color: ${typeColors[type]};"></span>${type}`;
        legendEl.appendChild(item);
    });
    const clusterLabel = document.createElement('div');
    clusterLabel.className = 'legend-item';
    clusterLabel.innerHTML = `<span class="legend-key" style="background-color: #51bbd6;"></span><b>군집(클러스터)</b>`;
    legendEl.appendChild(clusterLabel);

    let map;

    window.onload = function() {
        // 1. 지도 엔진 초기화
        map = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "glyphs": "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
                "sources": {
                    "osm-tiles": {
                        "type": "raster",
                        "tiles": ["https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png"],
                        "tileSize": 256,
                        "attribution": "© OpenStreetMap contributors"
                    }
                },
                "layers": [
                    {
                        "id": "osm-layer",
                        "type": "raster",
                        "source": "osm-tiles",
                        "minzoom": 0,
                        "maxzoom": 19
                    }
                ]
            },
            center: [127.9780, 36.5665], 
            zoom: 7
        });

        map.on('load', () => {
            console.log("배경 지도 로드 완료");
            
            // 🌟 내 깃허브 저장소에 들어있는 tour.geojson 파일 맵에 시각화
            const GEOJSON_URL = "https://koostar85.github.io/tour/tour.geojson";

            map.addSource('my-gis-data', {
                type: 'geojson',
                data: GEOJSON_URL,
                cluster: true,            
                clusterMaxZoom: 13,       
                clusterRadius: 60         
            });

            // 레이어 A: 클러스터 원형 마커
            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'my-gis-data',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 30, '#f1f075', 100, '#f28cb1'],
                    'circle-radius': ['step', ['get', 'point_count'], 18, 30, 24, 100, 30]
                }
            });

            // 레이어 B: 클러스터 내부 숫자
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'my-gis-data',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count}',
                    'text-size': 12
                }
            });

            // 레이어 C: 개별 마커
            map.addLayer({
                id: 'unclustered-point',
                type: 'circle',
                source: 'my-gis-data',
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-color': [
                        'match', ['get', 'type'],
                        '관광지', typeColors['관광지'],
                        '축제', typeColors['축제'],
                        '행사', typeColors['행사'],
                        '공연', typeColors['공연'],
                        typeColors['기타']
                    ],
                    'circle-radius': 7,
                    'circle-stroke-width': 1.5,
                    'circle-stroke-color': '#fff'
                }
            });

            // 상호작용 피드백 설정
            map.on('click', 'clusters', (e) => {
                const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('my-gis-data').getClusterExpansionZoom(clusterId, (err, zoom) => {
                    if (err) return;
                    map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom + 0.5 });
                });
            });

            map.on('click', 'unclustered-point', (e) => {
                const props = e.features[0].properties;
                let dateRow = '';
                
                const sDate = props['start date'] || props['start_date'];
                const eDate = props['end date'] || props['end_date'];
                const addr = props['place'] || props['address'] || '주소 정보 없음';

                if (sDate && sDate !== 'nan' && sDate !== '') {
                    dateRow = `<p style="margin:5px 0; font-size:12px;">🗓️ <b>기간:</b> ${sDate} ~ ${eDate || '미정'}</p>`;
                }

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <div style="padding:5px; font-family:'Malgun Gothic',sans-serif;">
                            <span style="background:${typeColors[props.type] || '#7f8c8d'}; color:white; padding:2px 6px; border-radius:3px; font-size:10px; font-weight:bold;">${props.type}</span>
                            <h3 style="margin:8px 0 5px 0; font-size:15px; border-bottom:1px solid #eee; padding-bottom:5px; color:#111;">${props.title}</h3>
                            <p style="margin:5px 0; font-size:12px;">📍 <b>지역:</b> ${props.city}</p>
                            <p style="margin:5px 0; font-size:12px; line-height:16px;">🏠 <b>주소:</b> ${addr}</p>
                            ${dateRow}
                        </div>
                    `)
                    .addTo(map);
            });

            const pointerLayers = ['clusters', 'unclustered-point'];
            pointerLayers.forEach(layer => {
                map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
            });
        });
    };

    // ==========================================
    // 🤖 Codespaces 백엔드 서버 연동 이벤트 코드
    // ==========================================
    document.getElementById('send-btn').addEventListener('click', processAiCommand);

    async function processAiCommand() {
        const btn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');

        // 로딩 UI 처리
        btn.disabled = true;
        statusEl.innerHTML = "⏳ <b>분석 진행 중...</b><br>백엔드 서버와 구글 Gemini AI가 협력하여 맞춤 가이드를 연동하고 있습니다. (약 3~5초 소요)";

        try {
            // ⚠️ 주의: 현재 정상 작동을 검증한 실시간 Codespaces 백엔드 주소로 호출합니다.
            const response = await fetch('https://crispy-space-garbanzo-q7jwvg5v46qvcxjx9-3000.app.github.dev/api/analyze-geo');
            
            if (!response.ok) {
                throw new Error(`백엔드 서버 에러 (상태 코드: ${response.status})`);
            }

            const data = await response.json();

            if (data.success) {
                // 성공: 백엔드가 안전 슬라이싱해서 받아온 한국어 텍스트 분석 결과 출력
                statusEl.innerText = data.result;
            } else {
                statusEl.innerText = "❌ AI 분석 실패: " + data.error;
            }
        } catch (error) {
            console.error("최종 연결 실패:", error);
            statusEl.innerHTML = "❌ <b>서버 연결 실패</b><br>Codespaces 터미널에서 <b>node server.js</b>가 정상 가동 중인지 다시 한번 확인해 주세요!";
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
