<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>대한민국 공간정보 AI 검색 포털 (실시간 대화 제어형)</title>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background-color: #f4f3f0; }
        
        .ai-container {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 340px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .ai-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .ai-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ai-btn:hover { background: #1557b0; }
        .ai-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        
        .status-box { 
            font-size: 13px; 
            color: #374151; 
            max-height: 250px; 
            overflow-y: auto; 
            background: #f9fafb; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #f3f4f6;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .legend {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; padding: 12px; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3); font-size: 12px; line-height: 20px; min-width: 120px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-key { display: inline-block; border-radius: 50%; width: 10px; height: 10px; margin-right: 8px; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ai-container">
    <h3>🪄 Gemini GIS 통합 AI 검색</h3>
    <div class="input-group">
        <input type="text" id="gis-command" class="ai-input" placeholder="예: 전라남도 여수시 데이터 보여줘">
        <button id="send-btn" class="ai-btn">요청</button>
    </div>
    <div id="status" class="status-box">궁금한 지역이나 관광 명소 질문을 입력창에 던져보세요!</div>
</div>

<div class="legend" id="map-legend">
    <h4>🎨 데이터 마커 구분</h4>
</div>

<script>
    const typeColors = {
        '관광지': '#007cbf',
        '축제': '#ff5252',
        '행사': '#2ecc71',
        '공연': '#9b59b6',
        '기타': '#7f8c8d'
    };

    const legendEl = document.getElementById('map-legend');
    Object.keys(typeColors).forEach(type => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="legend-key" style="background-color: ${typeColors[type]};"></span>${type}`;
        legendEl.appendChild(item);
    });

    let map;

    window.onload = function() {
        map = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "glyphs": "[https://demotiles.maplibre.org/font/](https://demotiles.maplibre.org/font/){fontstack}/{range}.pbf",
                "sources": {
                    "osm-tiles": {
                        "type": "raster",
                        "tiles": ["https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png"],
                        "tileSize": 256,
                        "attribution": "© OpenStreetMap contributors"
                    }
                },
                "layers": [{ "id": "osm-layer", "type": "raster", "source": "osm-tiles", "minzoom": 0, "maxzoom": 19 }]
            },
            center: [127.9780, 36.5665], 
            zoom: 7
        });

        map.on('load', () => {
            const GEOJSON_URL = "[https://koostar85.github.io/tour/tour.geojson](https://koostar85.github.io/tour/tour.geojson)";

            map.addSource('my-gis-data', {
                type: 'geojson',
                data: GEOJSON_URL,
                cluster: true,            
                clusterMaxZoom: 13,       
                clusterRadius: 60         
            });

            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'my-gis-data',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 30, '#f1f075', 100, '#f28cb1'],
                    'circle-radius': ['step', ['get', 'point_count'], 18, 30, 24, 100, 30]
                }
            });

            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'my-gis-data',
                filter: ['has', 'point_count'],
                layout: { 'text-field': '{point_count}', 'text-size': 12 }
            });

            map.addLayer({
                id: 'unclustered-point',
                type: 'circle',
                source: 'my-gis-data',
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-color': ['match', ['get', 'type'], '관광지', typeColors['관광지'], '축제', typeColors['축제'], '행사', typeColors['행사'], '공연', typeColors['공연'], typeColors['기타']],
                    'circle-radius': 7, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#fff'
                }
            });
        });
    };

    // 엔터키 지원 추가
    document.getElementById('gis-command').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') processAiCommand();
    });
    document.getElementById('send-btn').addEventListener('click', processAiCommand);

    async function processAiCommand() {
        const commandInput = document.getElementById('gis-command');
        const btn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        const queryText = commandInput.value.trim();

        if (!queryText) return alert("질문을 입력해 주세요!");

        btn.disabled = true;
        statusEl.innerHTML = "⏳ <b>Gemini가 공간 데이터를 지능 분석 중입니다...</b>";

        try {
            // POST 통신으로 사용자의 자유 질문 전송
            const response = await fetch('[https://effective-meme-v69xp7jprgjj3q7x-3000.app.github.dev/api/analyze-geo](https://effective-meme-v69xp7jprgjj3q7x-3000.app.github.dev/api/analyze-geo)', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: queryText })
            });
            
            if (!response.ok) throw new Error("서버 응답 오류");
            const data = await response.json();

            if (data.success) {
                // 1. AI 가이드 해설 텍스트 노출
                statusEl.innerText = data.message;

                // 2. 지도 동적 필터링 주입 (클러스터와 일반 마커 레이어 일괄 적용)
                if (!data.filter) {
                    map.setFilter('clusters', ['has', 'point_count']);
                    map.setFilter('cluster-count', ['has', 'point_count']);
                    map.setFilter('unclustered-point', ['!', ['has', 'point_count']]);
                } else {
                    map.setFilter('clusters', ["all", data.filter, ["has", "point_count"]]);
                    map.setFilter('cluster-count', ["all", data.filter, ["has", "point_count"]]);
                    map.setFilter('unclustered-point', ["all", data.filter, ["!", ["has", "point_count"]]]);
                }

                // 3. AI가 지정한 핵심 중심지 좌표와 확대(Zoom) 비율로 부드럽게 화면 비행 이동(FlyTo)
                if (data.center) {
                    map.flyTo({
                        center: data.center,
                        zoom: data.zoom || 10,
                        essential: true,
                        speed: 1.2
                    });
                }
            } else {
                statusEl.innerText = "❌ 분석 실패: " + data.error;
            }
        } catch (error) {
            console.error(error);
            statusEl.innerHTML = "❌ <b>연결 실패</b><br>백엔드 서버 가동 상태를 점검해 주세요.";
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
