<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>대한민국 공간정보 AI 검색 포털 (초안정화 버전)</title>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background-color: #f4f3f0; }
        
        .ai-container {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px;
        }
        .ai-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .ai-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ai-btn:hover { background: #1557b0; }
        .status-box { font-size: 12px; color: #666; max-height: 100px; overflow-y: auto; }
        .api-key-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        
        .legend {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; padding: 12px; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3); font-size: 12px; line-height: 20px; min-width: 120px;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-key { display: inline-block; border-radius: 50%; width: 10px; height: 10px; margin-right: 8px; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ai-container">
    <h3>🪄 Gemini GIS 통합 AI 검색</h3>
    <div class="input-group">
        <input type="text" id="gis-command" class="ai-input" placeholder="예: 경기도에 있는 축제 보여줘">
        <button id="send-btn" class="ai-btn">요청</button>
    </div>
    <div id="status" class="status-box">명령어 또는 검색 키워드를 입력하세요.</div>
    <div class="api-key-section">
        <input type="password" id="gemini-key" class="ai-input" placeholder="Gemini API Key 입력">
    </div>
</div>

<div class="legend" id="map-legend">
    <h4>🎨 데이터 마커 구분</h4>
</div>

<script>
    const typeColors = {
        '관광지': '#007cbf',
        '축제': '#ff5252',
        '행사': '#2ecc71',
        '공연': '#9b59b6',
        '기타': '#7f8c8d'
    };

    // 범례 생성
    const legendEl = document.getElementById('map-legend');
    Object.keys(typeColors).forEach(type => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="legend-key" style="background-color: ${typeColors[type]};"></span>${type}`;
        legendEl.appendChild(item);
    });
    const clusterLabel = document.createElement('div');
    clusterLabel.className = 'legend-item';
    clusterLabel.innerHTML = `<span class="legend-key" style="background-color: #51bbd6;"></span><b>군집(클러스터)</b>`;
    legendEl.appendChild(clusterLabel);

    // 1. PMTiles 프로토콜 등록
    const protocol = new pmtiles.Protocol();
    maplibreGl.addProtocol("pmtiles", protocol.tile);

    // GitHub Pages 도메인 인식 경로 처리 완료
    const PMTILES_URL = `${window.location.origin}${window.location.pathname.replace(/\/$/, "")}/map1.pmtiles`;

    // 2. OSM 지도가 깨지지 않도록 절대 안전한 오픈소스 CDN 주소 구조 세팅
    const map = new maplibreGl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "osm-tiles": {
                    "type": "raster",
                    // 카토DB(CartoDB) 미러와 OSM 공식 미러 동시 백업 구성
                    "tiles": [
                        "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
                        "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"
                    ],
                    "tileSize": 256,
                    "attribution": "© OpenStreetMap contributors"
                }
            },
            "layers": [
                {
                    "id": "osm-layer",
                    "type": "raster",
                    "source": "osm-tiles",
                    "minzoom": 0,
                    "maxzoom": 19
                }
            ]
        },
        center: [127.9780, 36.5665],
        zoom: 7
    });

    map.on('load', () => {
        // 3. PMTiles 데이터 소스 추가
        map.addSource('my-pmtiles-data', {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`, 
            cluster: true,            
            clusterMaxZoom: 13,       
            clusterRadius: 60         
        });

        // ⚠️ 1단계에서 -l 옵션으로 고정한 레이어 이름인 'locations'를 지정합니다.
        const SOURCE_LAYER = 'locations';

        // 4. 레이어 구성 A: 클러스터
        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'my-pmtiles-data',
            'source-layer': SOURCE_LAYER,
            filter: ['has', 'point_count'],
            paint: {
                'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 30, '#f1f075', 100, '#f28cb1'],
                'circle-radius': ['step', ['get', 'point_count'], 18, 30, 24, 100, 30]
            }
        });

        // 5. 레이어 구성 B: 숫자
        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'my-pmtiles-data',
            'source-layer': SOURCE_LAYER,
            filter: ['has', 'point_count'],
            layout: {
                'text-field': '{point_count}',
                'text-size': 11
            }
        });

        // 6. 레이어 구성 C: 개별 마커
        map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'my-pmtiles-data',
            'source-layer': SOURCE_LAYER,
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': [
                    'match', ['get', 'type'],
                    '관광지', typeColors['관광지'],
                    '축제', typeColors['축제'],
                    '행사', typeColors['행사'],
                    '공연', typeColors['공연'],
                    typeColors['기타']
                ],
                'circle-radius': 7,
                'circle-stroke-width': 1.5,
                'circle-stroke-color': '#fff'
            }
        });

        // 클릭 이벤트 핸들러
        map.on('click', 'clusters', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            const clusterId = features[0].properties.cluster_id;
            map.getSource('my-pmtiles-data').getClusterExpansionZoom(clusterId, (err, zoom) => {
                if (err) return;
                map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom + 0.5 });
            });
        });

        map.on('click', 'unclustered-point', (e) => {
            const props = e.features[0].properties;
            let dateRow = '';
            // 업로드하신 CSV의 'start date' 스펙 유효성 검사 처리
            if (props['start date'] && props['start date'] !== 'nan' && props['start date'] !== '') {
                dateRow = `<p style="margin:5px 0; font-size:12px;">🗓️ <b>기간:</b> ${props['start date']} ~ ${props['end date'] || '미정'}</p>`;
            }

            new maplibreGl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(`
                    <div style="padding:5px;">
                        <span style="background:${typeColors[props.type] || '#7f8c8d'}; color:white; padding:2px 6px; border-radius:3px; font-size:10px; font-weight:bold;">${props.type}</span>
                        <h3 style="margin:8px 0 5px 0; font-size:15px; border-bottom:1px solid #eee; padding-bottom:5px;">${props.title}</h3>
                        <p style="margin:5px 0; font-size:12px;">📍 <b>지역:</b> ${props.city}</p>
                        <p style="margin:5px 0; font-size:12px;">🏠 <b>주소:</b> ${props.place || props.address}</p>
                        ${dateRow}
                    </div>
                `)
                .addTo(map);
        });

        const pointerLayers = ['clusters', 'unclustered-point'];
        pointerLayers.forEach(layer => {
            map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
        });
    });

    // 7. 제미나이 AI 검색 연동 (CSV 컬럼 매핑 완벽 반영)
    document.getElementById('send-btn').addEventListener('click', processAiCommand);
    document.getElementById('gis-command').addEventListener('keypress', (e) => { if(e.key === 'Enter') processAiCommand(); });
    
    async function processAiCommand() {
        const command = document.getElementById('gis-command').value;
        const apiKey = document.getElementById('gemini-key').value;
        const statusEl = document.getElementById('status');

        if (!command) return alert('명령어를 입력하세요.');
        if (!apiKey) return alert('Gemini API Key를 입력해주세요.');

        statusEl.innerText = "공간 데이터 필터 쿼리를 구성 중입니다...";

        const systemInstruction = `
        너는 웹 지도 시스템(PMTiles 벡터레이어)의 실시간 검색 및 필터를 제어하는 GIS 인공지능 어시스턴트야.
        사용자의 요구사항을 분석해서 MapLibre GL JS용 필터 규칙(JSON)을 도출해야 해.
        - 컬럼 규칙 명세: type, city, title
        출력은 반드시 마크다운(\`\`\`) 없이 순수 JSON 오브젝트 문자열만 반환해.
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemInstruction + "\n\n사용자 검색어: " + command }] }]
                })
            });

            const resData = await response.json();
            let aiResponseText = resData.candidates[0].content.parts[0].text.trim();
            aiResponseText = aiResponseText.replace(/```json|```/g, ''); 
            
            const result = JSON.parse(aiResponseText);
            statusEl.innerText = `검색 결과: ${result.message}`;
            
            if (result.filter === null) {
                map.setFilter('clusters', ['has', 'point_count']);
                map.setFilter('cluster-count', ['has', 'point_count']);
                map.setFilter('unclustered-point', ['!', ['has', 'point_count']]);
            } else {
                map.setFilter('clusters', ["all", result.filter, ["has", "point_count"]]);
                map.setFilter('cluster-count', ["all", result.filter, ["has", "point_count"]]);
                map.setFilter('unclustered-point', ["all", result.filter, ["!", ["has", "point_count"]]]);
            }
            
            map.flyTo({ center: result.center, zoom: result.zoom, essential: true });

        } catch (error) {
            console.error(error);
            statusEl.innerText = "분석 중 에러가 발생했습니다.";
        }
    }
</script>
</body>
</html>
