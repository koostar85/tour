<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Gemini AI 연동 GIS - 관광지 클러스터맵</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* 제미나이 프롬프트 UI 스타일 */
        .ai-container {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px;
        }
        .ai-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .ai-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ai-btn:hover { background: #1557b0; }
        .status-box { font-size: 12px; color: #666; max-height: 100px; overflow-y: auto; }
        .api-key-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ai-container">
    <h3>🪄 Gemini GIS 관광지 검색</h3>
    <div class="input-group">
        <input type="text" id="gis-command" class="ai-input" placeholder="예: 전라남도에 있는 관광지만 보여줘">
        <button id="send-btn" class="ai-btn">요청</button>
    </div>
    <div id="status" class="status-box">명령을 입력하세요 (관광지 전용 클러스터맵).</div>
    <div class="api-key-section">
        <input type="password" id="gemini-key" class="ai-input" placeholder="Gemini API Key 입력">
    </div>
</div>

<script>
    // 1. OSM 배경 지도 초기화
    const map = new maplibreGl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "osm-tiles": {
                    "type": "raster",
                    "tiles": ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                    "tileSize": 256,
                    "attribution": "© OpenStreetMap contributors"
                }
            },
            "layers": [{ "id": "osm-layer", "type": "raster", "source": "osm-tiles" }]
        },
        center: [127.9780, 36.5665],
        zoom: 7
    });

    map.on('load', () => {
        // 2. Tippecanoe 벡터 타일 소스 추가 
        // (클라이언트 사이드 클러스터링을 위해 cluster: true 옵션을 적용합니다)
        map.addSource('my-gis-data', {
            type: 'vector',
            tiles: ['https://your-cloudfront-id.cloudfront.net/my_tiles/{z}/{x}/{y}.pbf'], // 본인 경로로 수정
            minzoom: 5,
            maxzoom: 15,
            cluster: true,            // 클러스터링 활성화
            clusterMaxZoom: 14,       // 이 줌 레벨 미만까지만 군집화 수행
            clusterRadius: 50         // 군집화할 반경 픽셀 범위
        });

        // 3. 레이어 구성 A: 클러스터 원형 마커 (여러 개 뭉쳐있는 그룹)
        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'my-gis-data',
            'source-layer': 'locations',
            // 'type'이 '관광지'인 데이터만 클러스터링 레이어에 참여하도록 기본 필터 설정
            filter: ['has', 'point_count'], 
            paint: {
                // 관광지 개수에 따라 클러스터 마커 색상과 크기 차등 부여
                'circle-color': [
                    'step', ['get', 'point_count'],
                    '#51bbd6', 10,   // 10개 미만: 하늘색
                    '#f1f075', 50,   // 50개 미만: 노란색
                    '#f28cb1'        // 50개 이상: 분홍색
                ],
                'circle-radius': [
                    'step', ['get', 'point_count'],
                    18, 10,          // 10개 미만 크기 18px
                    24, 50,          // 50개 미만 크기 24px
                    30               // 50개 이상 크기 30px
                ]
            }
        });

        // 4. 레이어 구성 B: 클러스터 내부 숫자 텍스트 표시
        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'my-gis-data',
            'source-layer': 'locations',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': '{point_count}',
                'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                'text-size': 12
            }
        });

        // 5. 레이어 구성 C: 개별 관광지 마커 (줌인해서 낱개로 쪼개졌을 때 모양)
        map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'my-gis-data',
            'source-layer': 'locations',
            filter: ['all', ['!', ['has', 'point_count']], ['==', 'type', '관광지']], // 낱개이면서 '관광지'인 것만
            paint: {
                'circle-color': '#007cbf', // 관광지 고유 색상 (파란색)
                'circle-radius': 7,
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });

        // 6. 인터랙션: 클러스터 클릭 시 줌인 확대 효과
        map.on('click', 'clusters', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            const clusterId = features[0].properties.cluster_id;
            
            // MapLibre 내부 확장 줌 레벨 가져오기 구조 호출
            map.getSource('my-gis-data').getClusterExpansionZoom(clusterId, (err, zoom) => {
                if (err) return;
                map.easeTo({
                    center: features[0].geometry.coordinates,
                    zoom: zoom + 0.5
                });
            });
        });

        // 7. 인터랙션: 개별 관광지 마커 클릭 시 팝업창 표출
        map.on('click', 'unclustered-point', (e) => {
            const props = e.features[0].properties;
            new maplibreGl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(`<h3>📌 ${props.title}</h3><p><b>위치:</b> ${props.city}</p><p><b>주소:</b> ${props.address}</p>`)
                .addTo(map);
        });

        // 마우스 커서 스타일 변경
        map.on('mouseenter', 'clusters', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'clusters', () => { map.getCanvas().style.cursor = ''; });
        map.on('mouseenter', 'unclustered-point', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'unclustered-point', () => { map.getCanvas().style.cursor = ''; });
    });

    // 8. 제미나이 AI 연동 및 동적 필터 처리
    document.getElementById('send-btn').addEventListener('click', processAiCommand);
    
    async function processAiCommand() {
        const command = document.getElementById('gis-command').value;
        const apiKey = document.getElementById('gemini-key').value;
        const statusEl = document.getElementById('status');

        if (!command) return alert('명령어를 입력하세요.');
        if (!apiKey) return alert('Gemini API Key를 입력해주세요.');

        statusEl.innerText = "Gemini 분석 중...";

        const systemInstruction = `
        너는 웹 지도(MapLibre GL JS)의 클러스터 레이어 필터를 제어하는 GIS 어시스턴트야.
        사용자의 요구사항을 분석해서 해당 지역이나 조건에 맞는 필터 규칙(JSON 데이터)만 정확히 반환해야 해.
        
        [중요 사항]
        - 이 지도는 '관광지' 데이터만 전용으로 표현하는 클러스터 맵이야. 따라서 기본 조건으로 type = '관광지'가 상시 유지되거나 반영되어야 해.
        - 데이터 속성 정의 정보:
          * city: '서울', '강원도', '전라남도', '경상남도', '제주도', '경기도', '대구', '부산' 등 (사용자가 '전남'이라고 하면 '전라남도'로 매핑할 것)
        
        결과는 반드시 아래의 순수한 JSON 포맷으로만 대답해줘. 다른 텍스트나 마크다운(\`\`\`) 표현은 절대 허용하지 마.
        {
          "filter": ["all", ["==", "type", "관광지"], ["==", "city", "전라남도"]],
          "center": [126.4622, 34.8160],
          "zoom": 9,
          "message": "전라남도 지역의 관광지 클러스터만 필터링합니다."
        }
        만약 '전체 다 보여줘'라고 하면 filter 조건을 ["==", "type", "관광지"] 로 설정하고 center는 대한민국 중심[127.9780, 36.5665], zoom은 7로 설정해줘.
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemInstruction + "\n\n사용자 명령: " + command }] }]
                })
            });

            const resData = await response.json();
            let aiResponseText = resData.candidates[0].content.parts[0].text.trim();
            aiResponseText = aiResponseText.replace(/```json|```/g, ''); // 방어 코드
            
            const result = JSON.parse(aiResponseText);
            statusEl.innerText = `결과: ${result.message}`;
            
            // 9. 제미나이 필터 규칙을 지도 레이어에 각각 적용
            if (map.getLayer('clusters')) {
                // 클러스터 덩어리는 내부 카운트('point_count')가 있으면서 제미나이가 준 필터 조건(도시 등)을 만족해야 함
                // 여기서는 유동적인 필터 결합을 위해 전역 세팅을 변경하거나, 낱개 포인트 필터를 업데이트합니다.
                const combinedFilter = ["all", result.filter, ["has", "point_count"]];
                map.setFilter('clusters', combinedFilter);
                map.setFilter('cluster-count', combinedFilter);
            }
            if (map.getLayer('unclustered-point')) {
                // 낱개 포인트는 point_count가 없으면서 제미나이의 필터 조건을 만족해야 함
                const combinedPointFilter = ["all", result.filter, ["!", ["has", "point_count"]]];
                map.setFilter('unclustered-point', combinedPointFilter);
            }
            
            // 지도 시점 이동
            map.flyTo({ center: result.center, zoom: result.zoom, essential: true });

        } catch (error) {
            console.error(error);
            statusEl.innerText = "에러 발생: 올바른 명령 형식이 아니거나 API 키를 확인하세요.";
        }
    }
</script>
</body>
</html>
