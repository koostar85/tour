<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour - 여행 가이드</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🌍 Tour</div>
            <ul class="nav-links">
                <li><a href="#home">홈</a></li>
                <li><a href="#tours">투어</a></li>
                <li><a href="#about">소개</a></li>
                <li><a href="#contact">연락처</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>세계를 탐험하세요</h1>
                <p>최고의 여행 가이드와 함께 새로운 경험을 만들어보세요</p>
                <button class="cta-button">투어 시작하기</button>
            </div>
        </div>
    </section>

    <section id="tours" class="tours">
        <div class="container">
            <h2>인기 투어</h2>
            <div class="tours-grid">
                <div class="tour-card">
                    <img src="https://via.placeholder.com/300x200" alt="도시 투어">
                    <h3>도시 투어</h3>
                    <p>주요 도시의 문화유산과 현대 건축을 둘러보세요</p>
                    <button>더 알아보기</button>
                </div>
                <div class="tour-card">
                    <img src="https://via.placeholder.com/300x200" alt="자연 투어">
                    <h3>자연 투어</h3>
                    <p>아름다운 자연 경관과 야생동물을 체험해보세요</p>
                    <button>더 알아보기</button>
                </div>
                <div class="tour-card">
                    <img src="https://via.placeholder.com/300x200" alt="음식 투어">
                    <h3>음식 투어</h3>
                    <p>지역의 맛있는 음식과 문화를 경험해보세요</p>
                    <button>더 알아보기</button>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="container">
            <h2>소개</h2>
            <p>Tour는 세계 곳곳의 최고의 여행지를 소개하고 맞춤형 여행 계획을 도와드립니다.</p>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>연락처</h2>
            <form>
                <input type="email" placeholder="이메일" required>
                <textarea placeholder="메시지를 입력하세요"></textarea>
                <button type="submit">전송</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Tour. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
