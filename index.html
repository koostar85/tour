<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>대한민국 공간정보 AI 검색 포털 (초안정화 최종본)</title>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background-color: #f4f3f0; }
        
        /* 제미나이 통합 AI 검색창 UI */
        .ai-container {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .ai-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .ai-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ai-btn:hover { background: #1557b0; }
        .status-box { font-size: 12px; color: #666; max-height: 100px; overflow-y: auto; }
        .api-key-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        
        /* 동적 범례 UI */
        .legend {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            background: white; padding: 12px; border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3); font-size: 12px; line-height: 20px; min-width: 120px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-key { display: inline-block; border-radius: 50%; width: 10px; height: 10px; margin-right: 8px; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ai-container">
    <h3>🪄 Gemini GIS 통합 AI 검색</h3>
    <div class="input-group">
        <input type="text" id="gis-command" class="ai-input" placeholder="예: 전라남도에 있는 촬영지 검색해줘">
        <button id="send-btn" class="ai-btn">요청</button>
    </div>
    <div id="status" class="status-box">명령어 또는 검색 키워드를 입력하세요.</div>
    <div class="api-key-section">
        <input type="password" id="gemini-key" class="ai-input" placeholder="Gemini API Key 입력">
    </div>
</div>

<div class="legend" id="map-legend">
    <h4>🎨 데이터 마커 구분</h4>
</div>

<script>
    // 1. 종류별 색상 정의 및 범례 자동 생성
    const typeColors = {
        '관광지': '#007cbf',
        '축제': '#ff5252',
        '행사': '#2ecc71',
        '공연': '#9b59b6',
        '기타': '#7f8c8d'
    };

    const legendEl = document.getElementById('map-legend');
    Object.keys(typeColors).forEach(type => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<span class="legend-key" style="background-color: ${typeColors[type]};"></span>${type}`;
        legendEl.appendChild(item);
    });
    const clusterLabel = document.createElement('div');
    clusterLabel.className = 'legend-item';
    clusterLabel.innerHTML = `<span class="legend-key" style="background-color: #51bbd6;"></span><b>군집(클러스터)</b>`;
    legendEl.appendChild(clusterLabel);

    // 전역 지도 객체 변수
    let map;

    // 2. 라이브러리가 완전히 로딩된 후 실행되도록 보장 (ReferenceError 원천 차단)
    window.onload = function() {
        
        // PMTiles 프로토콜 등록 (maplibregl 소문자 선언 필수!)
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        // GitHub Pages 환경에서 도메인 유연성을 확보하기 위한 상대 경로 계산 방식
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const PMTILES_URL = `${baseUrl}/map.pmtiles`;
        console.log("PMTiles 타일 주소 바인딩 완료:", PMTILES_URL);

        // 3. 배경지도 로드 (보안 Mixed Content 차단용 CartoDB 고안정성 주소 세팅)
        map = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "sources": {
                    "osm-tiles": {
                        "type": "raster",
                        "tiles": [
                            "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png"
                        ],
                        "tileSize": 256,
                        "attribution": "© OpenStreetMap contributors"
                    }
                },
                "layers": [
                    {
                        "id": "osm-layer",
                        "type": "raster",
                        "source": "osm-tiles",
                        "minzoom": 0,
                        "maxzoom": 19
                    }
                ]
            },
            center: [127.9780, 36.5665], // 대한민국 중심부
            zoom: 7
        });

        map.on('load', () => {
            console.log("지도 엔진 레이어 초기화 세팅 진행");

            // 4. PMTiles 소스 등록
            map.addSource('my-pmtiles-data', {
                type: 'vector',
                url: `pmtiles://${PMTILES_URL}`, 
                cluster: true,            
                clusterMaxZoom: 13,       
                clusterRadius: 60         
            });

            // Tippecanoe 컴파일 시 -l 옵션으로 고정한 레이어 타겟팅 명칭 명시
            const SOURCE_LAYER = 'locations';

            // 5. 레이어 구성 A: 클러스터 서클
            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'my-pmtiles-data',
                'source-layer': SOURCE_LAYER,
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 30, '#f1f075', 100, '#f28cb1'],
                    'circle-radius': ['step', ['get', 'point_count'], 18, 30, 24, 100, 30]
                }
            });

            // 6. 레이어 구성 B: 클러스터 내부 카운팅 숫자 기입
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'my-pmtiles-data',
                'source-layer': SOURCE_LAYER,
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count}',
                    'text-size': 11
                }
            });

            // 7. 레이어 구성 C: 개별 마커 (CSV 컬럼 연동 동적 매핑 컬러칩화)
            map.addLayer({
                id: 'unclustered-point',
                type: 'circle',
                source: 'my-pmtiles-data',
                'source-layer': SOURCE_LAYER,
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-color': [
                        'match', ['get', 'type'],
                        '관광지', typeColors['관광지'],
                        '축제', typeColors['축제'],
                        '행사', typeColors['행사'],
                        '공연', typeColors['공연'],
                        typeColors['기타']
                    ],
                    'circle-radius': 7,
                    'circle-stroke-width': 1.5,
                    'circle-stroke-color': '#fff'
                }
            });

            // 클러스터 클릭 시 구역 줌-인 핸들러
            map.on('click', 'clusters', (e) => {
                const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('my-pmtiles-data').getClusterExpansionZoom(clusterId, (err, zoom) => {
                    if (err) return;
                    map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom + 0.5 });
                });
            });

            // 8. 개별 낱개 포인트 마커 클릭 시 팝업
